
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser Theme -->
    <meta name="theme-color" content="#11110f" />
    <meta name="color-scheme" content="dark" />

    <!-- Primary SEO -->
    <title>Global Wealth | Member Dashboard & Community Platform</title>

    <meta
      name="title"
      content="Global Wealth | Member Dashboard & Community Platform"
    />

    <meta
      name="description"
      content="Welcome to Global Wealth, a digital community platform. Access your member dashboard, manage your account, explore membership packages, review transactions and track your activity."
    />

    <meta
      name="keywords"
      content="Global Wealth, Global Wealth Platform, Member Dashboard, Membership Platform, Digital Community, Account Management, Package Details, Member Network"
    />

    <meta name="author" content="Global Wealth Team" />
    <meta name="application-name" content="Global Wealth" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Site Icon -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <!-- Open Graph: WhatsApp, Facebook, Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global Wealth" />

    <meta
      property="og:title"
      content="Global Wealth | Member Dashboard & Community Platform"
    />

    <meta
      property="og:description"
      content="Explore Global Wealth. Access your member dashboard, manage your account, view packages and stay connected with the community."
    />

    <meta property="og:image" content="/logo.jpg" />
    <meta property="og:image:alt" content="Global Wealth Logo" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Global Wealth | Member Dashboard"
    />

    <meta
      name="twitter:description"
      content="Access your Global Wealth member dashboard, manage your account and stay connected."
    />

    <meta name="twitter:image" content="/logo.jpg" />

    <!-- Mobile App / Browser Settings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Global Wealth" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Browser Referrer Policy -->
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>

    <!-- React Application -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
